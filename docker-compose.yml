version: "3.9"

services:

  db:
    image: postgres:17

    container_name: devlogger_db

    restart: always

    environment:
      POSTGRES_DB: devlogger_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend

    container_name: devlogger_backend

    command: gunicorn devlogger.wsgi:application --bind 0.0.0.0:8000

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    env_file:
      - ./backend/.env

    depends_on:
      - db

  frontend:
    build:
      context: ./frontend

    container_name: devlogger_frontend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend
  nginx:
    build:
      context: ./nginx

    container_name: devlogger_nginx

    ports:
      - "80:80"

    depends_on:
      - backend
      - frontend
volumes:
  postgres_data: